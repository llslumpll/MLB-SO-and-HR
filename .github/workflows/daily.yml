name: Daily MLB board update

"on":
  schedule:
    # Runs at 16:00 and 22:00 UTC (~noon and ~6pm ET) to refresh projections/odds,
    # plus 03:00 UTC (~10-11pm ET) after most games have finished, so grading
    # happens the same night instead of waiting for the next day's first run.
    # GitHub may delay scheduled runs by a few minutes during high load --
    # that's normal and not something to worry about.
    # 6am/10am/1pm/5pm Central (CDT = UTC-5). The 6am run's main job is
    # just getting a board file to exist as early as possible -- Kalshi
    # and PrizePicks often post lines before lineups are even confirmed,
    # and the frequent job can only attach odds to a board that already
    # exists. The other three runs upgrade that board to confirmed
    # lineups as they get posted throughout the day.
    # Note: fixed UTC times, will drift an hour relative to Central when
    # clocks change for DST (worth revisiting in Nov/Mar).
    - cron: '7 11 * * *'
    - cron: '7 15 * * *'
    - cron: '7 18 * * *'
    - cron: '7 22 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: mlb-board-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tzdata pandas

      - name: Run daily pipeline
        working-directory: .
        run: python scripts/run_daily.py

      - name: Commit and push updated data
        run: |
          git config user.name "mlb-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Daily board update $(date -u +%Y-%m-%d)"
          # Real bug fixed 2026-09-27: "git pull --rebase -X theirs" performs a
          # line-based TEXT merge whenever two runs' pushes race (this repo
          # runs 4 heavy builds/day plus an odds-refresh every 10 minutes, all
          # writing the same files -- overlap is routine, not rare). Git has
          # no concept of "this is a JSON array of player records"; it just
          # diffs text lines, and these files get fully re-sorted by
          # probability on every rebuild, which is exactly the kind of
          # reordering that confuses a line-based diff. Confirmed via direct
          # local simulation of this exact race, twice: once producing the
          # same player appearing twice with two different probabilities
          # (matching a real, live example from 2026-09-26 -- Jonathan Aranda
          # showing both 41.3% and 21.3% for the same game), and once
          # producing silent, permanent data loss (three players' updates
          # vanishing with no trace or warning). Since this repo has a single
          # automated writer and every run's data/ output is a complete,
          # independently-recomputed, self-consistent snapshot -- never an
          # incremental patch -- there is no legitimate reason to want a
          # line-merged hybrid of two runs' files. Whichever run finishes
          # should simply become the new truth, wholesale. This retries by
          # re-fetching and re-stacking our already-committed working tree on
          # the new tip, never by merging file content -- verified against
          # the exact same simulated race to produce zero duplicates and zero
          # data loss.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --soft origin/main
            git add data/
            git diff --cached --quiet && echo "No changes to commit" || git commit -m "Daily board update $(date -u +%Y-%m-%d)"
            if git push origin HEAD:main; then
              echo "Pushed successfully on attempt $i"
              exit 0
            fi
            echo "Push rejected on attempt $i, retrying..."
            sleep $((RANDOM % 10 + 5))
          done
          # Caught in review, not something the original code needed: a
          # plain "for" loop's exit code is whatever its LAST command was --
          # here, always the retry "sleep", which never fails. Without this,
          # exhausting all 5 attempts would report the step as successful
          # even though nothing was ever pushed, silently hiding a real
          # failure instead of surfacing it the way the old single git-push
          # call properly did.
          echo "::error::Failed to push after 5 attempts"
          exit 1
