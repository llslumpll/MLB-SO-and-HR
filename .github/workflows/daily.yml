name: Daily MLB board update

"on":
  schedule:
    # Runs at 16:00 and 22:00 UTC (~noon and ~6pm ET) to refresh projections/odds,
    # plus 03:00 UTC (~10-11pm ET) after most games have finished, so grading
    # happens the same night instead of waiting for the next day's first run.
    # GitHub may delay scheduled runs by a few minutes during high load --
    # that's normal and not something to worry about.
    # 6am/10am/1pm/5pm Central (CDT = UTC-5). The 6am run's main job is
    # just getting a board file to exist as early as possible -- Kalshi
    # and PrizePicks often post lines before lineups are even confirmed,
    # and the frequent job can only attach odds to a board that already
    # exists. The other three runs upgrade that board to confirmed
    # lineups as they get posted throughout the day.
    # Note: fixed UTC times, will drift an hour relative to Central when
    # clocks change for DST (worth revisiting in Nov/Mar).
    - cron: '7 11 * * *'
    - cron: '7 15 * * *'
    - cron: '7 18 * * *'
    - cron: '7 22 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: mlb-board-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Run daily pipeline
        working-directory: .
        run: python scripts/run_daily.py

      - name: Commit and push updated data
        run: |
          git config user.name "mlb-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Daily board update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
