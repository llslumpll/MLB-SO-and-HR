name: Odds refresh (frequent)

"on":
  schedule:
    # Every 10 minutes, offset 3 minutes past each mark (:03, :13, :23...)
    # to avoid the :00/:15/:30/:45 marks where everyone else's scheduled
    # workflows fire at once -- GitHub's scheduler gets most congested
    # right at those exact times, which is also roughly when this job's
    # delivery reliability matters most (evening game hours). This is
    # lightweight: re-pulls live Kalshi/PrizePicks prices for today's
    # already-built board, tracks price movement, and grades any games
    # that have finished. Does NOT rebuild projections/stats/matchups --
    # that's the heavier daily.yml job.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mlb-board-data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Refresh odds
        run: python scripts/refresh_odds.py

      - name: Commit and push if changed
        run: |
          git config user.name "mlb-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No price changes to commit"
          else
            git commit -m "Odds refresh $(date -u +%Y-%m-%dT%H:%M)"
            # Same real fix as daily.yml, same day -- see that file for the
            # full writeup and the local race simulation that confirmed both
            # the failure (duplicate/lost entries from "pull --rebase -X
            # theirs" line-merging a resorted JSON file) and this fix
            # (zero duplicates, zero data loss under the identical simulated
            # race). This job runs every 10 minutes, so it's the most
            # frequent writer to these files and the most likely to ever
            # encounter a race, whatever its exact trigger turns out to be.
            for i in 1 2 3 4 5; do
              git fetch origin main
              git reset --soft origin/main
              git add data/
              git diff --cached --quiet && echo "No changes to commit" || git commit -m "Odds refresh $(date -u +%Y-%m-%dT%H:%M)"
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i"
                break
              fi
              echo "Push rejected on attempt $i, retrying..."
              sleep $((RANDOM % 10 + 5))
            done
          fi
